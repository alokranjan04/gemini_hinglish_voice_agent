name: Deploy Jyotish Voice Agent to Cloud Run

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: testcnx-169610
  SERVICE_NAME: jyotish-voice-agent
  REGION: us-central1
  IMAGE_NAME: us-central1-docker.pkg.dev/testcnx-169610/jyotish-repo/jyotish-voice-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Build and Push Docker Image
      run: |
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image $IMAGE_NAME \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GMAIL_USER=${{ secrets.GMAIL_USER }},GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }},VOBIZ_NUMBER=${{ secrets.VOBIZ_NUMBER }}" \
          --timeout=3600
